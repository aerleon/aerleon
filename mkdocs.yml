dev_addr: '127.0.0.1:8001'
edit_uri: edit/main/docs
site_dir: site/docs
site_name: Aerleon Documentation
site_url: 'https://aerleon.readthedocs.io/en/latest/'
repo_url: 'https://github.com/aerleon/aerleon'
copyright: Copyright &copy; The Authors
theme:
  name: material
  hljs_languages:
    - python
    - yaml
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
extra_css:
  - css/extra.css
extra:
  generator: false
  social:
    - icon: fontawesome/brands/slack
      link: 'https://join.slack.com/t/aerleon/shared_invite/zt-1ngckm6oj-cK7yj63A~JgqjixEui2Vhw'
      name: Network to Code Community
    - icon: fontawesome/brands/slack
      link: 'https://slack.networktocode.com/'
      name: Network to Code Community
    - icon: fontawesome/brands/github
      link: 'https://github.com/aerleon'
      name: GitHub Organization
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details # https://squidfunk.github.io/mkdocs-material/reference/admonitions/#details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
plugins:
  - search
  - mkdocs-version-annotations
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .
          options:
            docstring_section_style: table
nav:
  - Overview:
    - Overview: index.md
    - Install and Configure: install.md
    - Getting Started: getting_started.md
    - FAQ: faq.md
    - Contributing: contributing.md
    - Links: links.md
  - Usage:
    - Command Line Usage: reference/cli.md
    - Policy Files: reference/yaml_reference.md
    - Naming: reference/naming.md
    - AclCheck: aclcheck.md
  - API:
    - Generate API: api.md
    - AclCheck API: aclcheck_api.md
  - Reference:
    - Generators:
      - reference/generators/index.md
      - Common: reference/generators/common.md
      - ICMP Types: reference/generators/icmp_types.md
      - Arista:
        - Arista: reference/generators/arista.md
        - Arista Traffic-Policy: reference/generators/arista_tp.md
      - Aruba: reference/generators/aruba.md
      - Brocade: reference/generators/brocade.md
      - Cisco:
        - Cisco: reference/generators/cisco.md
        - CiscoASA: reference/generators/ciscoasa.md
        - CiscoNX: reference/generators/cisconx.md
        - CiscoXR: reference/generators/ciscoxr.md
      - Fortigate: reference/generators/fortigate.md
      - Google Cloud:
        - GCE: reference/generators/gce.md
      - Juniper:
        - Juniper: reference/generators/juniper.md
        - Juniper EVO: reference/generators/juniperevo.md
        - Juniper MSMPC: reference/generators/msmpc.md
        - JuniperSRX: reference/generators/srx.md
        - SRXlo: reference/generators/srxlo.md
      - K8s: reference/generators/k8s.md
      - Linux:
        - IpTables: reference/generators/iptables.md
        - Ipset: reference/generators/ipset.md
        - Speedway: reference/generators/speedway.md
        - Nftables: reference/generators/nftables.md
      - Nokia SR Linux: reference/generators/nokiasrl.md
      - NVUE API: reference/generators/nvueapi.md
      - PacketFilter: reference/generators/packetfilter.md
      - PaloAltoFW: reference/generators/paloalto.md
      - PcapFilter: reference/generators/pcap.md
      - Proxmox: reference/generators/proxmox.md
      - VMware NSX:
        - NSXv: reference/generators/nsxv.md
        - NSXt: reference/generators/nsxt.md
      - Windows:
        - Windows Advanced Firewall: reference/generators/windows_advfirewall.md
        - WindowsIPSec: reference/generators/windows_ipsec.md
    - Generator Development: reference/generator_patterns.md
